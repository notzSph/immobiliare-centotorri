name: Bug report
description: Report a reproducible problem with the website.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include customer details, credentials, private contact submissions, or security vulnerabilities in this public form.
  - type: input
    id: page
    attributes:
      label: Page or route
      placeholder: /immobili/example-property
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the actions and expected result.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
